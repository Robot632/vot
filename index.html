<style>
:root{--bg:#e9eef2;--paper:#fff;--ink:#14202b;--mute:#5c6b78;--stamp:#b3202a;--line:#c9d3db;--bar:#14202b}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--paper:#18222b;--ink:#eef2f5;--mute:#91a1ae;--stamp:#ff6b73;--line:#2c3a46;--bar:#eef2f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:1.55;padding:24px 16px 60px}
main{max-width:620px;margin:0 auto}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,8vw,3.2rem);line-height:1.02;margin:12px 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 28px}
.logo{display:block;width:104px;height:104px;border-radius:50%;margin:4px 0 6px}
.ballot{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:22px;margin-bottom:22px;position:relative}
.ballot h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:1.25rem;margin:0 0 16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1.5px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.box{width:22px;height:22px;border:2px solid var(--ink);flex:none;position:relative}
.opt[aria-pressed=true]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.opt[aria-pressed=true] .box::after{content:"X";position:absolute;inset:-4px 0 0 3px;font:800 22px "Bricolage Grotesque",sans-serif;color:var(--stamp)}
.go{font:600 1rem "Bricolage Grotesque",system-ui,sans-serif;background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:12px 20px;cursor:pointer;margin-top:6px}
.go:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;margin-left:12px}
.row{margin:0 0 12px}
.row .top{display:flex;justify-content:space-between;gap:12px}
.track{height:12px;background:var(--line);margin-top:4px}
.fill{height:100%;background:var(--bar);width:0;transition:width .5s}
.msg{color:var(--stamp);margin:10px 0 0;min-height:1.4em}
.done{position:absolute;top:16px;right:16px;border:2px solid var(--stamp);color:var(--stamp);font:800 .8rem "Bricolage Grotesque",sans-serif;padding:2px 8px;transform:rotate(6deg);border-radius:3px}
.total{color:var(--mute);margin:14px 0 0}
.login input,.login textarea{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper);color:var(--ink);margin-bottom:10px;letter-spacing:.02em}
.login textarea{resize:vertical}
.admin,.poll{padding:0;overflow:hidden}
.admin-head{background:var(--ink);color:var(--paper);padding:16px 22px;font:800 1.1rem "Bricolage Grotesque",system-ui,sans-serif}
.admin-body{padding:22px;position:relative}
.qcard{border:1.5px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.qcard h3{font:800 1.05rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px}
.ans{margin-bottom:10px}
.ans-top{display:flex;justify-content:space-between;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:999px;padding:2px 10px;font-size:.85rem}
.chip.miss{background:none;border:1px dashed var(--line);color:var(--mute)}
.lbl{display:block;font:800 .85rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--stamp);margin:0 0 4px}
.lbl.mute{color:var(--mute);margin-top:26px}
.poll input{font:inherit;width:100%;background:transparent;color:var(--ink);border:0;border-bottom:2px solid var(--line);border-radius:0;padding:10px 2px;margin:0}
.poll input:focus{outline:0;border-bottom-color:var(--stamp)}
.poll input.main{font-size:1.15rem;border-bottom-color:var(--ink)}
.optrow{display:flex;align-items:center;gap:8px;margin:6px 0 6px 18px}
.optrow .x{background:none;border:0;color:var(--mute);font-size:1.3rem;cursor:pointer;line-height:1}
.addopt{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;margin:6px 0 0 18px;padding:8px 2px}
.addopt:hover{color:var(--ink)}
.addopt:disabled{opacity:.35;cursor:default}
.hint{color:var(--mute);font-size:.9rem;margin:14px 0 0;padding-right:70px}
.send{position:absolute;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.send:disabled{opacity:.35;cursor:default}
.poll .msg{padding-right:70px;margin-bottom:56px}
.chip.pick{border:1.5px solid var(--line);cursor:pointer;font:inherit;font-size:.9rem;color:inherit;background:none;padding:4px 12px}
.chip.pick[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.pick:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.only{color:var(--mute);font-size:.9rem;margin:-6px 0 12px}
.note{color:var(--mute);font-size:.9rem;margin:-8px 0 14px}
.poll input[type=datetime-local]{width:auto;min-width:230px}
.chk{display:flex;align-items:center;gap:10px;margin:16px 0 0;cursor:pointer}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--mute);word-break:break-all}
.poll #mn,.poll #mr,.poll #mrnew{margin-bottom:10px}
.poll #mr{width:100%}
.poll select{font:inherit;max-width:100%;padding:8px 2px;background:transparent;color:var(--ink);border:0;border-bottom:2px solid var(--line);border-radius:0}
.editbox{border:1.5px dashed var(--line);border-radius:8px;padding:12px;margin:10px 0}
.editbox input{font:inherit;width:100%;background:transparent;color:var(--ink);border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px;margin:0 0 8px}
.editbox input:focus{outline:0;border-bottom-color:var(--stamp)}
.poll .chk input[type=checkbox]{width:20px;height:20px;padding:0;margin:0;border:0;accent-color:var(--ink)}
</style>
</head>

      m.includes("intrebare invalida") ? "Întrebare invalidă: scrie textul și cel puțin 2 variante." :
      m.includes("alegere invalida") ? "Variantă invalidă." :
      m.includes("functie nepermisa") ? "Această întrebare nu e pentru funcția ta." :
      m.includes("votul e inchis") ? "Votul s-a închis." :
      m.includes("cod admin") ? "Nu poți schimba codul unui administrator." :
      m.includes("numar variante") ? "Poți redenumi variantele, nu adăuga sau șterge." :
      m.includes("nume invalid") ? "Scrie numele membrului." :
      m.includes("nu poti sterge") ? "Nu poți șterge un administrator." :
      "Eroare (" + r.status + "). Încearcă din nou.");
    e.dup = m.includes("duplicate");
    throw e;
  }
  return body;
}

const key = id => "vot_" + CODE + "_" + id;
function voted(id){ try{ return localStorage.getItem(key(id)); }catch(e){ return null; } }
function markVoted(id, c){ try{ localStorage.setItem(key(id), c); }catch(e){} }
function logout(){ try{ localStorage.removeItem("cod_membru"); sessionStorage.removeItem("debug_role"); }catch(e){} CODE = null; start(); }

let ADMIN = false;
let OUTCOME = {};
const fmtD = d => new Date(d).toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
const fmt = d => new Date(d).toLocaleString("ro-RO", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const isClosed = q => q.closed === true || (!!q.closes_at && new Date(q.closes_at) <= new Date());
const hiddenRes = q => !ADMIN && (q.secret === true || (q.hide_results === true && !isClosed(q)));
function noteEl(q){
  let t = "";
  if(isClosed(q)) t = "Votul s-a închis.";
  else if(q.closes_at) t = "Se închide pe " + fmt(q.closes_at) + ".";
  if(q.secret) t += (t ? " " : "") + "Rezultatele sunt vizibile doar pentru organizator.";
  else if(hiddenRes(q)) t += (t ? " " : "") + "Rezultatele se văd după închiderea votului.";
  if(q.kind === "lege" || q.kind === "recrutare"){
    const thr = q.threshold >= 99 ? "unanimitate" : q.threshold >= 66 ? "două treimi" : "peste jumătate";
    t = (q.kind === "lege" ? "Propunere de lege. " : "Vot de recrutare. ") + t +
      " Condiție de adoptare: " + thr + " din voturile Pentru și Împotrivă" + (q.quorum > 0 ? ", cu cvorum de " + q.quorum + "% din membri" : "") + ".";
  }
  t = t.trim();
  if(!t) return null;
  const p = document.createElement("p"); p.className = "note"; p.textContent = t; return p;
}

function csvCell(v){ v = String(v == null ? "" : v); if(/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
function downloadCsv(file, rows){
  const txt = "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = file;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); }catch(_){} t.remove(); }
  if(btn){ const o = btn.textContent; btn.textContent = "Copiat"; setTimeout(() => btn.textContent = o, 1500); }
}

function renderLogin(){

  const inp = wrap.querySelector("#cod"), msg = wrap.querySelector(".msg"), btn = wrap.querySelector("#intra");

async function showResults(q, box, msg){
  try{
    if(hiddenRes(q)){
      box.innerHTML = (isClosed(q) ? '<span class="done">' + (OUTCOME[q.id] || "ÎNCHIS") + '</span>' : voted(q.id) ? '<span class="done">VOTAT</span>' : '') + '<h2></h2>';
      box.querySelector("h2").textContent = q.question_text;
      const n0 = noteEl(q); if(n0) box.appendChild(n0);
      const ok = document.createElement("p"); ok.className = "total"; ok.textContent = "Votul tău a fost înregistrat."; box.appendChild(ok);
      return;
    }
    const rows = await rpc("get_results", { p_code: CODE, p_question: q.id });
    const counts = {}; rows.forEach(r => counts[r.choice] = Number(r.n));
    const total = q.options.reduce((s, o) => s + (counts[o] || 0), 0);
    const mine = voted(q.id);
    box.innerHTML = (isClosed(q) ? '<span class="done">' + (OUTCOME[q.id] || "ÎNCHIS") + '</span>' : mine ? '<span class="done">VOTAT</span>' : '') + '<h2></h2>' +
      q.options.map(o => {
        const n = counts[o] || 0, p = total ? Math.round(n * 100 / total) : 0;
        return `<div class="row"><div class="top"><span>${esc(o)}${mine === o ? " (votul tău)" : ""}</span><span>${n} · ${p}%</span></div><div class="track"><div class="fill" data-w="${p}"></div></div></div>`;
      }).join("") + `<p class="total">${total} ${total === 1 ? "vot" : "voturi"}</p>` +
      (mine || isClosed(q) ? "" : '<button class="link" id="back">Înapoi la vot</button>');
    box.querySelector("h2").textContent = q.question_text;
    const nt = noteEl(q); if(nt) box.querySelector("h2").after(nt);
    requestAnimationFrame(() => box.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"));
    const b = box.querySelector("#back"); if(b) b.onclick = () => renderVote(q, box);
    if(DEBUG){ const n = document.createElement("p"); n.className = "total"; n.textContent = "Cont de test: votul tău nu se numără."; box.appendChild(n); }
  }catch(e){ if(msg) msg.textContent = e.message; }
}

function renderVote(q, box){
  let pick = null;
  box.innerHTML = '<h2></h2>' +
    q.options.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false"><span class="box"></span>${esc(o)}</button>`).join("") +
    `<button class="go" disabled>Votează</button><button class="link" id="see">Vezi rezultatele</button><p class="msg" role="alert"></p>`;
  box.querySelector("h2").textContent = q.question_text;
  const nv = noteEl(q); if(nv) box.querySelector("h2").after(nv);
  const go = box.querySelector(".go"), msg = box.querySelector(".msg");
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    pick = q.options[+b.dataset.i];
    box.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b));
    go.disabled = false;
  });
  go.onclick = async () => {
    go.disabled = true; msg.textContent = "";
    try{ await rpc("cast_vote", { p_code: CODE, p_question: q.id, p_choice: pick }); if(!DEBUG) markVoted(q.id, pick); showResults(q, box, msg); }
    catch(e){
      if(e.dup){ markVoted(q.id, "-"); showResults(q, box, msg); }
      else { msg.textContent = e.message; go.disabled = false; }
    }
  };
  const see = box.querySelector("#see"); if(hiddenRes(q)) see.remove(); else see.onclick = () => showResults(q, box, msg);
}

  try{ roleList = (await rpc("role_options", { p_code: CODE })).map(x => x.role); }catch(e){}
  const picked = new Set(), rbox = nq.querySelector("#roles");
  if(roleList.length){
    roleList.forEach(rl => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip pick"; b.textContent = rl; b.setAttribute("aria-pressed", "false");
      b.onclick = () => { picked.has(rl) ? picked.delete(rl) : picked.add(rl); b.setAttribute("aria-pressed", picked.has(rl)); };
      rbox.appendChild(b);
    });
  } else {
    rbox.innerHTML = '<input id="rtxt" placeholder="ex: Președinte, Secretar (separate prin virgulă)" aria-label="Funcții">';
  }
  addBtn.onclick = () => addOpt().focus();
  nq.querySelector("#qadd").onclick = async () => {
    const text = nq.querySelector("#qt").value.trim();
    msg.textContent = "";
    let options = [...optsBox.querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
    if(kind !== "normal") options = ["Pentru", "Împotrivă", "Mă abțin"];
    if(!text){ msg.textContent = kind === "recrutare" ? "Scrie numele candidatului." : "Scrie textul."; return; }
    if(options.length < 2){ msg.textContent = "Adaugă cel puțin 2 variante."; return; }
    if(new Set(options.map(o => o.toLowerCase())).size !== options.length){ msg.textContent = "Variantele trebuie să fie diferite."; return; }
    const rt = nq.querySelector("#rtxt");
    const roles = rt ? rt.value.split(",").map(x => x.trim()).filter(Boolean) : [...picked];
    const cl = nq.querySelector("#qclose").value;
    try{
      await rpc("add_question", {
        p_code: CODE, p_text: kind === "recrutare" ? "Primim în partid pe " + text + "?" : text, p_options: options,
        p_roles: roles.length ? roles : null, p_closes_at: cl ? new Date(cl).toISOString() : null,
        p_hide: nq.querySelector("#qhide").checked, p_secret: nq.querySelector("#qsecret").checked,
        p_kind: kind, p_subject: kind === "recrutare" ? text : null,
        p_quorum: kind === "normal" ? 0 : +nq.querySelector("#qquo").value, p_threshold: kind === "normal" ? 50 : +nq.querySelector("#qthr").value
      });
      start();
    }catch(e){ msg.textContent = e.message; }
  };

  const mp = document.createElement("section"); mp.className = "ballot poll";
  mp.innerHTML = `<div class="admin-head">Membri</div><div class="admin-body">
    <label class="lbl" for="mn">Membru nou</label>
    <input id="mn" placeholder="Nume" autocomplete="off">
    <select id="mr" aria-label="Funcție"></select>
    <input id="mrnew" placeholder="Numele funcției noi" autocomplete="off" aria-label="Funcție nouă" hidden>
    <button class="go" id="madd">Adaugă membru</button>
    <p class="msg" role="alert"></p>
    <div id="newcode"></div>
    <span class="lbl mute">Toți membrii (${voters.length})</span>
    <div id="mlist"></div></div>`;
  wrap.appendChild(mp);
  const sel = mp.querySelector("#mr"), rnew = mp.querySelector("#mrnew");
  const addOption = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
  addOption("", "Alege funcția");
  [...new Set(members.filter(m => !m.is_debug).map(m => m.role).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ro")).forEach(x => addOption(x, x));
  addOption("__new", "+ Altă funcție…");
  sel.onchange = () => { rnew.hidden = sel.value !== "__new"; if(!rnew.hidden) rnew.focus(); };
  const mlist = mp.querySelector("#mlist");
  members.forEach(m => {
    const row = document.createElement("div"); row.className = "mrow";
    const left = document.createElement("div");
    const nm = document.createElement("div"); nm.textContent = m.name + (m.role ? " · " + m.role : "") + (m.is_admin ? " (admin)" : m.is_debug ? " (test)" : "");
    const cd = document.createElement("div"); cd.className = "code"; cd.textContent = m.code;
    left.append(nm, cd); row.appendChild(left);
    const act = document.createElement("div");
    const cb = document.createElement("button"); cb.className = "link"; cb.style.margin = "0 10px 0 0"; cb.textContent = "Copiază cod"; cb.onclick = () => copyText(m.code, cb); act.appendChild(cb);
    if(!m.is_admin){
      const nb = document.createElement("button"); nb.className = "link"; nb.style.margin = "0 10px 0 0"; nb.textContent = "Cod nou";
      nb.onclick = async () => {
        if(!confirm("Generezi cod nou pentru " + m.name + "? Codul vechi nu va mai funcționa.")) return;
        try{ showCode(m.name, await rpc("regenerate_code", { p_code: CODE, p_member: m.code })); }catch(e){ alert(e.message); }
      };
      act.appendChild(nb);
      const db = document.createElement("button"); db.className = "link"; db.style.margin = "0"; db.textContent = "Șterge";
      db.onclick = async () => {
        if(!confirm("Ștergi membrul " + m.name + " și voturile lui?")) return;
        try{ await rpc("delete_member", { p_code: CODE, p_member: m.code }); start(); }catch(e){ alert(e.message); }
      };
      act.appendChild(db);
    }
    row.appendChild(act); mlist.appendChild(row);
  });
  const mmsg = mp.querySelector(".msg"), nc = mp.querySelector("#newcode");
  function showCode(name, code){
    nc.innerHTML = '<p class="total">Cod pentru <b></b>:</p><div class="code" style="font-size:1rem;color:var(--ink)"></div>';
    nc.querySelector("b").textContent = name; nc.querySelector(".code").textContent = code;
    const cb = document.createElement("button"); cb.className = "link"; cb.style.marginLeft = "0"; cb.textContent = "Copiază codul"; cb.onclick = () => copyText(code, cb); nc.appendChild(cb);
    nc.scrollIntoView({ block: "nearest" });
  }
  mp.querySelector("#madd").onclick = async () => {
    const nm = mp.querySelector("#mn").value.trim(), rl = sel.value === "__new" ? rnew.value.trim() : sel.value;
    mmsg.textContent = ""; nc.textContent = "";
    if(!nm){ mmsg.textContent = "Scrie numele membrului."; return; }
    try{
      const code = await rpc("add_member", { p_code: CODE, p_name: nm, p_role: rl || null });
      showCode(nm, code);
      mp.querySelector("#mn").value = ""; sel.value = ""; rnew.value = ""; rnew.hidden = true;
    }catch(e){ mmsg.textContent = e.message; }
  };
}

async function renderRolePicker(name){
  sub.textContent = "Cont de test (" + name + "): alege funcția cu care intri. Votul tău nu se numără.";
  wrap.innerHTML = "";
  let roles = [];
  try{ roles = (await rpc("role_options", { p_code: CODE })).map(x => x.role); }catch(e){ sub.textContent = e.message; return; }
  const box = document.createElement("section"); box.className = "ballot";
  const h = document.createElement("h2"); h.textContent = "Alege funcția"; box.appendChild(h);
  if(!roles.length){ const p = document.createElement("p"); p.className = "total"; p.textContent = "Nicio funcție în baza de date."; box.appendChild(p); }
  roles.forEach(r => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = r;
    b.onclick = () => { try{ sessionStorage.setItem("debug_role", r); }catch(e){} start(); };
    box.appendChild(b);
  });
  const out = document.createElement("button"); out.className = "link"; out.style.marginLeft = "0"; out.textContent = "Ieși"; out.onclick = logout; box.appendChild(out);
  wrap.appendChild(box);
}

async function start(){
  wrap.innerHTML = "";
  if(!CODE){ renderLogin(); return; }
  let name;
  try{ name = await rpc("member_name", { p_code: CODE }); }catch(e){ sub.textContent = e.message; return; }
  if(!name){ logout(); return; }
  let role = null;
  try{ role = await rpc("member_role", { p_code: CODE }); }catch(e){}
  DEBUG = false;
  try{ DEBUG = await rpc("is_debug", { p_code: CODE }) === true; }catch(e){}
  if(DEBUG){
    let chosen = null; try{ chosen = sessionStorage.getItem("debug_role"); }catch(e){}
    if(!chosen){ await renderRolePicker(name); return; }
    role = chosen;
  }
  sub.textContent = "Bună, " + name + (role ? ", " + role : "") + ". " + SUBTITLE + " ";
  const out = document.createElement("button"); out.className = "link"; out.style.marginLeft = "0"; out.textContent = "Ieși"; out.onclick = logout;
  sub.appendChild(out);
  if(DEBUG){
    const ch = document.createElement("button"); ch.className = "link"; ch.textContent = "Schimbă funcția";
    ch.onclick = () => { try{ sessionStorage.removeItem("debug_role"); }catch(e){} start(); };
    sub.appendChild(ch);
  }

  ADMIN = false;
  try{ ADMIN = await rpc("is_admin", { p_code: CODE }) === true; }catch(e){}
  let questions = [];
  try{ questions = await rpc("list_questions", { p_code: CODE, p_role: DEBUG ? role : null }); }catch(e){ sub.textContent = e.message; return; }
  OUTCOME = {};
  try{ (await rpc("question_outcomes", { p_code: CODE })).forEach(x => OUTCOME[x.question_id] = x.outcome); }catch(e){}
  if(!questions.length){
    const p = document.createElement("p"); p.className = "sub"; p.textContent = "Nu sunt întrebări încă. Revino mai târziu."; wrap.appendChild(p);
  }
  questions.forEach(q => {
    const box = document.createElement("section");
    box.className = "ballot";
    wrap.appendChild(box);
    (voted(q.id) || isClosed(q)) ? showResults(q, box) : renderVote(q, box);
  });
  try{
    const h = await rpc("recruitment_history", { p_code: CODE });
    if(h.length){
      const sec = document.createElement("section"); sec.className = "ballot"; sec.innerHTML = "<h2>Istoric recrutare</h2>";
      h.forEach(x => {
        const d = document.createElement("div"); d.className = "mrow";
        const a = document.createElement("span"); a.textContent = x.subject || "-";
        const b = document.createElement("b"); b.textContent = x.outcome + (x.decided_at ? " · " + fmtD(x.decided_at) : "");
        d.append(a, b); sec.appendChild(d);
      });
      wrap.appendChild(sec);
    }
  }catch(e){}
  try{ if(ADMIN) await renderAdmin(questions); }catch(e){}
}
start();
</script>
